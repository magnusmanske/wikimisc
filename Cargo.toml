[package]
name = "wikimisc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
keywords = ["wikibase", "wikidata", "mediawiki"]
repository = "https://github.com/magnusmanske/wikimisc"
description = "A library with MediaWiki-related functionality"
license = "MIT"
readme = "README.md"

# Every module lives behind a feature and there are no default features:
# consumers opt in to exactly the functionality — and therefore exactly the
# dependency tree — they need. See README.md for the feature table.
#
# Each feature lists every dependency its own modules use directly, even where
# another feature it enables would already pull that dependency in; the lists
# stay correct when features are recombined or their internals change.
[features]
# --- leaf features (no inter-feature dependencies) ---

# `date`, `timestamp`: Wikibase/MediaWiki date and timestamp parsing.
date = ["dep:anyhow", "dep:chrono", "dep:regex"]

# `disk_free`, `file_hash`, `file_vec`: disk-spilling collections. Spilled
# records are stored as JSON blobs, hence `serde_json`.
file-storage = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:tempfile"]

# `lat_lon`: coordinate pair type.
lat-lon = ["dep:anyhow", "dep:serde"]

# `seppuku`: inactivity watchdog that terminates the process when idle.
seppuku = ["dep:tokio"]

# `toolforge_app` plus the `toolforge` crate re-export.
toolforge = ["dep:toolforge"]

# The `wikibase` and `wikibase::mediawiki` re-exports. Implied by every
# feature that exposes Wikibase types in its public API.
wikibase = ["dep:wikibase"]

# --- composite features ---

# `sparql_value`, `sparql_results`: typed SPARQL bindings and result parsing.
sparql = [
    "lat-lon",
    "dep:regex",
    "dep:serde",
    "dep:serde_json",
    "dep:urlencoding",
]

# `sparql_table`, `sparql_table_trait`, `sparql_table_vec`: tabular SPARQL
# results, in-memory or spilling to disk.
sparql-table = ["sparql", "file-storage", "dep:anyhow"]

# `site_matrix`: MediaWiki site matrix lookups.
site-matrix = ["wikibase", "dep:anyhow", "dep:serde_json"]

# `wikidata`: Wikidata API/WDQS client with a fixed user agent and timeout.
wikidata = ["wikibase", "dep:anyhow", "dep:csv", "dep:reqwest", "dep:tempfile"]

# `external_id`: external-identifier property/value pairs. Enabling `wikidata`
# additionally exposes the Wikidata-search methods on `ExternalId`.
external-id = ["wikibase", "dep:chrono", "dep:regex", "dep:serde"]

# `item_merger`, `merge_diff`: merging Wikibase items into `wbeditentity` diffs.
item-merger = [
    "external-id",
    "wikibase",
    "dep:regex",
    "dep:serde",
    "dep:serde_json",
]

# `toolforge_db` plus the `mysql_async` re-export: Toolforge database pools.
database = ["toolforge", "dep:anyhow", "dep:mysql_async", "dep:serde_json"]

# Convenience umbrella enabling every feature above; also what the test suite
# and `cargo doc` are run with.
full = [
    "database",
    "date",
    "external-id",
    "file-storage",
    "item-merger",
    "lat-lon",
    "seppuku",
    "site-matrix",
    "sparql",
    "sparql-table",
    "toolforge",
    "wikibase",
    "wikidata",
]

[dependencies]
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
csv = { version = "1", optional = true }
mysql_async = { version = "0.36", optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
toolforge = { version = "5", optional = true }
urlencoding = { version = "^2", optional = true }
wikibase = { version = "^0.7", optional = true }

[dev-dependencies]
# Test-only deps, needed regardless of which features are enabled: several
# feature sets whose own dependency list excludes these still use them in their
# `#[cfg(test)]` modules (e.g. `lat-lon` round-trips through `serde_json`, and
# the async tests need a runtime even where the feature itself does not).
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
