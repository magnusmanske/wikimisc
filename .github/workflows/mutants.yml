name: Mutants

# Mutation testing is slow (every mutant rebuilds the crate and reruns the
# suite), so it runs weekly against the pure modules rather than on every push.
# A survivor means behaviour that no test observes; the report is uploaded
# either way.
on:
  schedule:
    - cron: "43 4 * * 1" # Mondays, 04:43 UTC
  workflow_dispatch:

jobs:
  mutants:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Mutants in the pure modules
        # `--all-features` matters: without it most of the crate is not
        # compiled, and every mutant would survive trivially.
        run: |
          cargo mutants --all-features --jobs 4 --timeout 120 \
            --file src/entity_id.rs \
            --file src/date.rs \
            --file src/lat_lon.rs \
            --file src/sparql_lexer.rs \
            --file src/sparql_rewrite.rs \
            --file 'src/sparql_rewrite/*.rs' \
            --file src/web/static_files.rs \
            --file src/escape.rs \
            --file src/title.rs \
            --file src/commons.rs \
            --file src/content_type.rs \
            --file src/wiki.rs

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
